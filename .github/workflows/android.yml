name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Configure release signing when maintainer secrets exist
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vaultriad.p12"
            chmod 600 "$RUNNER_TEMP/vaultriad.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/vaultriad.p12" >> "$GITHUB_ENV"
          fi
      - name: Native Android unit tests and APK builds
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Verify Android backups with the desktop crypto
        run: |
          npm ci --ignore-scripts
          VAULTRIAD_ANDROID_FIXTURE="$PWD/android/app/build/reports/android-portable.vtbackup" npx --no-install vitest run tests/android-compatibility.test.ts
      - name: Enable KVM access for the test emulator
        run: |
          sudo chmod a+rw /dev/kvm
      - name: Android emulator UI and locking test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Verify offline manifest and prepare APK
        run: |
          mkdir -p release/android
          if [[ -n "$ANDROID_KEYSTORE_PATH" ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk release/android/Vaultriad.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/android/Vaultriad.apk > "$RUNNER_TEMP/android-signature.txt"
            actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/android-signature.txt")
            expected=$(tr -d '\r\n' < android/SIGNING-CERT-SHA256.txt)
            [[ "$actual" == "$expected" ]]
            cp android/SIGNING-CERT-SHA256.txt release/android/SIGNING-CERT-SHA256.txt
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release/android/Vaultriad-unsigned.apk
          fi
          apk=$(find release/android -name '*.apk' -print -quit)
          permissions=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$apk")
          echo "$permissions"
          if grep -q 'android.permission.INTERNET' <<< "$permissions"; then exit 1; fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$apk" | grep -Fx 'com.vaultriad.app'
          unzip -p "$apk" assets/LICENSE.txt | cmp LICENSE -
          (cd release/android && sha256sum *.apk > SHA256SUMS-Android.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Android-test-results
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
          if-no-files-found: error
      - name: Publish signed preview or private unsigned signing handoff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -f release/android/Vaultriad.apk ]]; then
            tag="v1.0.0-android-preview"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" release/android/Vaultriad.apk release/android/SHA256SUMS-Android.txt release/android/SIGNING-CERT-SHA256.txt --clobber
            else
              gh release create "$tag" release/android/Vaultriad.apk release/android/SHA256SUMS-Android.txt release/android/SIGNING-CERT-SHA256.txt --target "$GITHUB_SHA" --prerelease --title 'Vaultriad 1.0.0 for Android — preview' --notes-file .github/android-release.md
            fi
          else
            gh release create "android-build-$GITHUB_RUN_ID" release/android/Vaultriad-unsigned.apk release/android/SHA256SUMS-Android.txt --draft --target "$GITHUB_SHA" --title 'Android unsigned signing handoff — maintainer only' --notes 'Unsigned build for private local signing. Do not publish this draft or install the unsigned APK. Retain the private release key for future updates.'
          fi
