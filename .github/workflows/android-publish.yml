name: Publish locally signed Android APK
on:
  workflow_dispatch:
    inputs:
      blob_sha:
        description: Git blob SHA containing the signed APK (no private signing material)
        required: true
      apk_sha256:
        description: SHA-256 of the signed APK
        required: true
      native_run:
        description: Successful Android APK native build run ID
        required: true
      source_sha:
        description: Full source commit SHA tested by that native run
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate source and retrieve signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BLOB_SHA: ${{ inputs.blob_sha }}
          APK_SHA256: ${{ inputs.apk_sha256 }}
          NATIVE_RUN: ${{ inputs.native_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ && "$APK_SHA256" =~ ^[0-9a-f]{64}$ && "$NATIVE_RUN" =~ ^[0-9]+$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p release/android "$RUNNER_TEMP/native-original"
          gh api "repos/$GH_REPO/actions/runs/$NATIVE_RUN" > "$RUNNER_TEMP/native-run.json"
          python3 - <<'PY'
          import json, os
          run=json.load(open(os.environ['RUNNER_TEMP']+'/native-run.json'))
          assert run['conclusion']=='success'
          assert run['head_sha']==os.environ['SOURCE_SHA']
          assert run['path']=='.github/workflows/android.yml'
          PY
          gh api "repos/$GH_REPO/git/blobs/$BLOB_SHA" --jq .content | base64 --decode > release/android/Vaultriad.apk
          printf '%s  %s\n' "$APK_SHA256" Vaultriad.apk > release/android/SHA256SUMS-Android.txt
          (cd release/android && sha256sum -c SHA256SUMS-Android.txt)
          gh release download "android-build-$NATIVE_RUN" --pattern Vaultriad-unsigned.apk --dir "$RUNNER_TEMP/native-original"
      - name: Verify signature, signer identity and native build contents
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/android/Vaultriad.apk > "$RUNNER_TEMP/signature.txt"
          cat "$RUNNER_TEMP/signature.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt")
          expected=$(tr -d '\r\n' < android/SIGNING-CERT-SHA256.txt)
          [[ "$actual" == "$expected" ]]
          python3 - <<'PY'
          import hashlib, os, zipfile
          signatures={'META-INF/MANIFEST.MF','META-INF/VAULTRIA.RSA','META-INF/VAULTRIA.SF'}
          def content(path):
              with zipfile.ZipFile(path) as z:
                  names=z.namelist()
                  assert len(names)==len(set(names)), 'Duplicate APK entries'
                  return {n:hashlib.sha256(z.read(n)).hexdigest() for n in names if n not in signatures}
          original=os.environ['RUNNER_TEMP']+'/native-original/Vaultriad-unsigned.apk'
          assert content(original)==content('release/android/Vaultriad.apk'), 'Signed APK differs from native-tested application content'
          print('Application contents match the tested native build; only signing metadata differs.')
          PY
          permissions=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions release/android/Vaultriad.apk)
          if grep -q 'android.permission.INTERNET' <<< "$permissions"; then exit 1; fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id release/android/Vaultriad.apk | grep -Fx 'com.vaultriad.app'
          unzip -p release/android/Vaultriad.apk assets/LICENSE.txt | cmp LICENSE -
          cp android/SIGNING-CERT-SHA256.txt release/android/SIGNING-CERT-SHA256.txt
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          tag=v1.0.0-android-preview
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/android/Vaultriad.apk release/android/SHA256SUMS-Android.txt release/android/SIGNING-CERT-SHA256.txt --clobber
            gh release edit "$tag" --draft=false --prerelease --notes-file .github/android-release.md
          else
            gh release create "$tag" release/android/Vaultriad.apk release/android/SHA256SUMS-Android.txt release/android/SIGNING-CERT-SHA256.txt --target "$SOURCE_SHA" --prerelease --title 'Vaultriad 1.0.0 for Android — signed preview' --notes-file .github/android-release.md
          fi
