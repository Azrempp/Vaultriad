name: Bug report
description: Report a problem using synthetic data only.
body:
  - type: markdown
    attributes:
      value: Suspected security vulnerability? Follow SECURITY.md instead of posting exploit details publicly. Never upload vaults, backups, exports, credentials, or secret screenshots.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and architecture
      placeholder: macOS / Windows / Linux, version, Intel / AMD64 / Apple silicon
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and expected/actual behavior
      description: Use a synthetic vault; include only redacted errors.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no real credentials, vaults, keychain data, backups, exports, or secret screenshots.
          required: true
